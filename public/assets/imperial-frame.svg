<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="frameGlow" cx="50%" cy="50%" r="52%">
      <stop offset="0%" stop-color="#e8bd62" stop-opacity="0.24"/>
      <stop offset="70%" stop-color="#1e293b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0b101d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="imperialGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4c8"/>
      <stop offset="35%" stop-color="#e2b453"/>
      <stop offset="70%" stop-color="#8c6218"/>
      <stop offset="100%" stop-color="#f7dd97"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#frameGlow)"/>
  <g transform="translate(200, 150)">
    <!-- Rotating Filigree Ring -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="96" fill="none" stroke="url(#imperialGold)" stroke-width="3" stroke-dasharray="12 6"/>
      <polygon points="0,-108 10,-94 -10,-94" fill="url(#imperialGold)"/>
      <polygon points="0,108 10,94 -10,94" fill="url(#imperialGold)"/>
      <polygon points="-108,0 -94,10 -94,-10" fill="url(#imperialGold)"/>
      <polygon points="108,0 94,10 94,-10" fill="url(#imperialGold)"/>
    </g>
    <!-- Inner Avatar Frame -->
    <circle cx="0" cy="0" r="80" fill="#0d1322" stroke="url(#imperialGold)" stroke-width="8"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="#fff3c4" stroke-width="1" opacity="0.5"/>
    <!-- Top Crown Emblem on Frame -->
    <path d="M-28,-76 L-36,-98 L-14,-84 L0,-104 L14,-84 L36,-98 L28,-76 Z" fill="url(#imperialGold)" stroke="#fff" stroke-width="0.8"/>
    <!-- Bottom Crest -->
    <polygon points="0,92 14,78 0,68 -14,78" fill="#ef233c" stroke="url(#imperialGold)" stroke-width="2"/>
  </g>
</svg>
