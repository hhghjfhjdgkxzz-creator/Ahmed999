<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="starBg" cx="50%" cy="50%" r="52%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.22"/>
      <stop offset="65%" stop-color="#e8bd62" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0b101d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="starSilverGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#starBg)"/>
  <g transform="translate(200, 150)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="22s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="98" fill="none" stroke="url(#starSilverGold)" stroke-width="2" stroke-dasharray="4 10"/>
      <circle cx="0" cy="-98" r="5" fill="#fef08a"/>
      <circle cx="98" cy="0" r="4" fill="#93c5fd"/>
      <circle cx="0" cy="98" r="5" fill="#fef08a"/>
      <circle cx="-98" cy="0" r="4" fill="#93c5fd"/>
    </g>
    <circle cx="0" cy="0" r="78" fill="#0d1424" stroke="url(#starSilverGold)" stroke-width="6"/>
    <!-- Star Emblem Top -->
    <polygon points="0,-96 6,-82 20,-82 9,-73 13,-59 0,-68 -13,-59 -9,-73 -20,-82 -6,-82" fill="#fef08a"/>
  </g>
</svg>
