<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#d8b76e" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#1a243b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0b101d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2c2"/>
      <stop offset="30%" stop-color="#e5c168"/>
      <stop offset="65%" stop-color="#9e7324"/>
      <stop offset="100%" stop-color="#f5dc98"/>
    </linearGradient>
    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6b7b"/>
      <stop offset="50%" stop-color="#c81d32"/>
      <stop offset="100%" stop-color="#5c0612"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bgGlow)"/>
  <g transform="translate(200, 155)">
    <animateTransform attributeName="transform" type="translate" values="200,158; 200,146; 200,158" dur="4s" repeatCount="indefinite"/>
    <!-- Outer Halo Ring -->
    <circle cx="0" cy="-10" r="92" fill="none" stroke="#d8b76e" stroke-width="1" stroke-dasharray="6 6" opacity="0.45">
      <animateTransform attributeName="transform" type="rotate" from="0 0 -10" to="360 0 -10" dur="24s" repeatCount="indefinite"/>
    </circle>
    <!-- Crown Base Shadow -->
    <ellipse cx="0" cy="68" rx="75" ry="10" fill="#000" opacity="0.45"/>
    <!-- Velvet Inner Cap -->
    <path d="M-68,25 C-68,-35 -30,-55 0,-55 C30,-55 68,-35 68,25 Z" fill="url(#rubyGrad)" opacity="0.9"/>
    <!-- Golden Crown Frame -->
    <path d="M-76,28 L-92,-38 L-42,2 L0,-62 L42,2 L92,-38 L76,28 Z" fill="url(#goldGrad)" stroke="#fff4cc" stroke-width="1.5" filter="url(#softGlow)"/>
    <!-- Base Band -->
    <rect x="-76" y="28" width="152" height="22" rx="6" fill="url(#goldGrad)" stroke="#fff3c4" stroke-width="1.2"/>
    <!-- Jewels on Band -->
    <polygon points="0,31 8,39 0,47 -8,39" fill="url(#rubyGrad)" stroke="#fff" stroke-width="0.8"/>
    <circle cx="-44" cy="39" r="5.5" fill="#38bdf8" stroke="#fff" stroke-width="0.8"/>
    <circle cx="44" cy="39" r="5.5" fill="#38bdf8" stroke="#fff" stroke-width="0.8"/>
    <!-- Peak Pearls -->
    <circle cx="-92" cy="-42" r="6" fill="#fff6d6"/>
    <circle cx="0" cy="-68" r="8" fill="#fff6d6" filter="url(#softGlow)"/>
    <circle cx="92" cy="-42" r="6" fill="#fff6d6"/>
  </g>
</svg>
